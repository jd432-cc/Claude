<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Builder &mdash; TheRacingData</title>
  <meta name="description" content="Fill a post-session data report and export it as a Word document in the TheRacingData house format. Runs entirely in the browser.">
  <link rel="canonical" href="https://theracingdata.com/tools/report-builder/">
  <meta property="og:title" content="Report Builder &mdash; TheRacingData">
  <meta property="og:description" content="Fill a post-session data report and export it as a Word document. Runs entirely in the browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://theracingdata.com/tools/report-builder/">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/report-builder.css">
  <!-- Standalone page only. Remove this line when embedding in the site shell. -->
  <link rel="stylesheet" href="css/standalone.css">
</head>
<body>
<!-- ==========================================================
     TheRacingData — Report Builder
     Drop-in page. Everything the tool needs lives inside
     #trd-report-builder. The <header> and <footer> below are
     marked data-standalone: delete both when embedding in the
     site shell, which already provides nav and footer.
     ========================================================== -->
<div id="trd-report-builder">

  <header data-standalone>
    <div class="brand-row">
      <div class="brand-lockup">
        <img src="assets/logo.svg" alt="TheRacingData"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <span class="brand-fallback">TheRacingData</span>
      </div>
      <div class="app-title">
        <p class="eyebrow">Performance Engineering</p>
        <h1><span id="doc-title">Report Builder</span> <em id="doc-sub"></em></h1>
      </div>
    </div>

    <div class="toolbar">
      <label class="tick">
        <input type="checkbox" id="provisional">
        <span>Mark figures provisional (P)</span>
      </label>
      <span class="spacer"></span>
      <button id="import-json" class="ghost">Load session</button>
      <button id="export-json" class="ghost">Save session</button>
      <button id="reset" class="ghost danger">Clear</button>
      <button id="export-draft" class="ghost">Export DRAFT</button>
      <button id="export-release" class="primary">Export RELEASE</button>
      <input type="file" id="import-file" accept=".json,.trd.json" hidden>
    </div>
    <p id="status" class="status"></p>
  </header>

  <main>
    <nav id="rail" aria-label="Report sections"></nav>

    <div class="column">
      <section id="pane"></section>
      <aside id="issues" class="issues" hidden></aside>

      <p class="privacy">
        This runs entirely in your browser. Nothing is uploaded, and the
        session is kept only in this browser&rsquo;s storage &mdash; use
        <strong>Save session</strong> to move it anywhere else.
      </p>
    </div>
  </main>

  <footer data-standalone>
    <p>TheRacingData &mdash; Modena. Template <code>psdr-circuit-v1.2</code>.</p>
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
