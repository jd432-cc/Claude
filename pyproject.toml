[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-sheets-mcp"
version = "0.1.0"
description = "MCP server that gives Claude read/write access to Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
]

[project.scripts]
google-sheets-mcp = "google_sheets_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["google_sheets_mcp"]
